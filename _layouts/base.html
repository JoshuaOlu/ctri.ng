<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — CTRI{% else %}CTRI | Free SSCE Textbooks for Nigerian Students{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Favicons -->
  <link rel="icon" href="/assets/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">

  <!-- OG / Social -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — CTRI{% else %}CTRI | Free SSCE Textbooks{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}/assets/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts — Lato from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.google_analytics }}');</script>
  {% endif %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <script>
    // Scroll animation
    const obs = new IntersectionObserver((entries, o) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); o.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.anim').forEach(el => obs.observe(el));

    // Mobile nav toggle
    const ham = document.querySelector('.nav-hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (ham) ham.addEventListener('click', () => navLinks.classList.toggle('open'));

    // Hero heading — word by word animation
    const heroH1 = document.querySelector('.hero-h1');
    if (heroH1) {
      const html = heroH1.innerHTML;
      // Wrap each word in a span, preserving HTML tags
      heroH1.innerHTML = html.replace(/(\w+)/g, (word) => `<span class="hero-word">${word}</span>`);
      const words = heroH1.querySelectorAll('.hero-word');
      words.forEach((word, i) => {
        setTimeout(() => {
          word.classList.add('visible');
        }, 120 + i * 60);
      });
    }

    // Chapter status badge animation — trigger when table enters view
    const badgeObs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.querySelectorAll('.ch-badge-published, .ch-badge-in-progress').forEach(badge => {
            badge.style.animation = 'none';
            badge.offsetHeight; // reflow
            badge.style.animation = '';
          });
          badgeObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.chapter-table').forEach(t => badgeObs.observe(t));
  </script>

</body>
</html>
