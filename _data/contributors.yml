# ═══════════════════════════════════════════════════════════════
# CTRI CONTRIBUTORS
# ───────────────────────────────────────────────────────────────
# This file lists everyone who has contributed to CTRI and has
# consented to being listed publicly on the contributors page.
#
# FIELD REFERENCE:
#   name        Full name as they want it displayed
#   roles       List of roles — one person can have multiple
#     title     Role title (e.g. "Chapter Writer", "Editor")
#     area      Subject or area (e.g. "Mathematics", "General")
#   period      When they contributed (e.g. "2025 – present")
#   status      "active" or "inactive"
#   linkedin    Full LinkedIn URL — optional, leave "" to hide
#
# ADDING A CONTRIBUTOR:
#   Only add someone here if they have explicitly consented
#   to being listed publicly on the CTRI website.
#   Add new active contributors at the top of the active section.
#
# MARKING INACTIVE:
#   Change status from "active" to "inactive".
#   They move to the inactive section automatically.
#   Do not delete — the record is part of CTRI's history.
# ═══════════════════════════════════════════════════════════════

